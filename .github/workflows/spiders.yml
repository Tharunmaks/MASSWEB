name: Mnx Spiders

on:
  schedule:
    - cron: "23 */4 * * *"   # crawl: every 4 hours
    - cron: "41 1,13 * * *"  # Common Crawl import: twice a day
  workflow_dispatch:
    inputs:
      mode:
        description: "crawl, import or both"
        default: "both"
        type: choice
        options: [both, crawl, import]
      wet_files:
        description: "Common Crawl files to import (about 1,700 pages each)"
        default: "60"
      minutes:
        description: "Minutes to crawl"
        default: "30"

concurrency:
  group: mnx-spiders
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  spiders:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: spider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spider/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the spiders
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_INDEX_MB: ${{ vars.MAX_INDEX_MB || '450' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"; WET="${{ inputs.wet_files }}"; MIN="${{ inputs.minutes }}"
          elif [ "${{ github.event.schedule }}" = "41 1,13 * * *" ]; then
            MODE=import; WET=60; MIN=0
          else
            MODE=crawl; WET=0; MIN=45
          fi
          python -m mnx.run --mode "$MODE" --wet-files "$WET" --minutes "$MIN"
